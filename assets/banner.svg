<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">hat</title>
  <desc id="desc">Four account terminals connected to one shared memory in the middle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#151b36"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#818cf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coreFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- Links from each account to the shared memory -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M 845 175 C 900 200, 905 260, 935 292" stroke="#2dd4bf" opacity="0.85"/>
    <path d="M 1105 175 C 1050 200, 1045 260, 1015 292" stroke="#fbbf24" opacity="0.85"/>
    <path d="M 845 465 C 900 440, 905 380, 935 348" stroke="#a78bfa" opacity="0.85"/>
    <path d="M 1105 465 C 1050 440, 1045 380, 1015 348" stroke="#fb7185" opacity="0.85"/>
  </g>
  <g>
    <circle cx="900" cy="228" r="4" fill="#2dd4bf"/>
    <circle cx="1050" cy="228" r="4" fill="#fbbf24"/>
    <circle cx="900" cy="412" r="4" fill="#a78bfa"/>
    <circle cx="1050" cy="412" r="4" fill="#fb7185"/>
  </g>

  <!-- Shared memory -->
  <circle cx="975" cy="320" r="150" fill="url(#coreGlow)"/>
  <circle cx="975" cy="320" r="50" fill="url(#coreFill)" filter="url(#soft)" opacity="0.7"/>
  <circle cx="975" cy="320" r="46" fill="url(#coreFill)"/>
  <circle cx="975" cy="320" r="46" fill="none" stroke="#e0f2fe" stroke-opacity="0.5" stroke-width="1.5"/>
  <g fill="none" stroke="#f0f9ff" stroke-width="2.6" stroke-linejoin="round" opacity="0.95">
    <path d="M 975 297 L 1000 309 L 975 321 L 950 309 Z" fill="#f0f9ff" fill-opacity="0.25"/>
    <path d="M 950 320 L 975 332 L 1000 320"/>
    <path d="M 950 331 L 975 343 L 1000 331"/>
  </g>

  <!-- Account terminals -->
  <g font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, monospace">
    <g transform="translate(700 110)">
      <rect width="180" height="98" rx="12" fill="#0f172a" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="4.5" fill="#2dd4bf"/><circle cx="33" cy="18" r="4.5" fill="#334155"/><circle cx="48" cy="18" r="4.5" fill="#334155"/>
      <text x="16" y="55" font-size="17" fill="#2dd4bf">❯ work</text>
      <rect x="16" y="68" width="96" height="6" rx="3" fill="#1e293b"/>
      <rect x="16" y="80" width="64" height="6" rx="3" fill="#1e293b"/>
    </g>
    <g transform="translate(1070 110)">
      <rect width="180" height="98" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="4.5" fill="#fbbf24"/><circle cx="33" cy="18" r="4.5" fill="#334155"/><circle cx="48" cy="18" r="4.5" fill="#334155"/>
      <text x="16" y="55" font-size="17" fill="#fbbf24">❯ client-a</text>
      <rect x="16" y="68" width="110" height="6" rx="3" fill="#1e293b"/>
      <rect x="16" y="80" width="52" height="6" rx="3" fill="#1e293b"/>
    </g>
    <g transform="translate(700 432)">
      <rect width="180" height="98" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="4.5" fill="#a78bfa"/><circle cx="33" cy="18" r="4.5" fill="#334155"/><circle cx="48" cy="18" r="4.5" fill="#334155"/>
      <text x="16" y="55" font-size="17" fill="#a78bfa">❯ research</text>
      <rect x="16" y="68" width="88" height="6" rx="3" fill="#1e293b"/>
      <rect x="16" y="80" width="120" height="6" rx="3" fill="#1e293b"/>
    </g>
    <g transform="translate(1070 432)">
      <rect width="180" height="98" rx="12" fill="#0f172a" stroke="#fb7185" stroke-opacity="0.7" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="4.5" fill="#fb7185"/><circle cx="33" cy="18" r="4.5" fill="#334155"/><circle cx="48" cy="18" r="4.5" fill="#334155"/>
      <text x="16" y="55" font-size="17" fill="#fb7185">❯ side</text>
      <rect x="16" y="68" width="70" height="6" rx="3" fill="#1e293b"/>
      <rect x="16" y="80" width="104" height="6" rx="3" fill="#1e293b"/>
    </g>
  </g>

  <!-- Title block -->
  <g font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, monospace">
    <text x="80" y="250" font-size="78" font-weight="700" fill="url(#titleGradient)">hat</text>
    <text x="82" y="312" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" fill="#cbd5e1">One head, many hats.</text>
    <text x="82" y="350" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" fill="#cbd5e1">Several Claude Code accounts, one shared memory.</text>
    <g transform="translate(82 398)">
      <rect width="170" height="50" rx="10" fill="#0f172a" stroke="#334155"/>
      <text x="18" y="33" font-size="20" fill="#64748b">$</text>
      <text x="40" y="33" font-size="20" fill="#e2e8f0">hat work</text>
    </g>
    <text x="82" y="560" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#64748b">For the Claude Code CLI · Windows and Linux</text>
  </g>
</svg>
